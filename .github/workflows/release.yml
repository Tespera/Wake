# 发布:推 vX.Y.Z tag 即触发——在真 Windows runner 上跑 make-windows.ps1
# 打 zip,建同名 GitHub Release 并附上产物,notes 取 CHANGELOG 对应段落。
# (gpui 的 shader 编译无法交叉,Windows 产物只能产自真 Windows;维护者无
# Windows 真机,发布产物由这里代产。)macOS/Linux 产物照旧由维护者本机
# make-app.sh / make-linux.sh 打好后追加到同一个 Release。
# Release 已存在时只补传 zip(--clobber),不动 notes。
name: Release

on:
  push:
    tags: ['v*']
  # 本仓库的开发环境经代理推送,tag 推送被 403 拦——手动派发时由 runner 的
  # 令牌代建 tag(gh release create 对不存在的 tag 会按 --target 顺带创建)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.7); created at the dispatched ref if missing'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows zip + GitHub Release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Package
        shell: pwsh
        run: ./scripts/make-windows.ps1

      # notes = CHANGELOG 里 "## [X.Y.Z]" 到下一个版本头之间的段落
      - name: Extract release notes
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { $env:GITHUB_REF_NAME }
          $ver = $tag -replace '^v', ''
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?s)## \[$([regex]::Escape($ver))\][^`n]*`n(.*?)(`n## \[|$)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          Set-Content -Path release-notes.md -Value $notes

      - name: Create release and upload zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { $env:GITHUB_REF_NAME }
          $zip = (Get-ChildItem dist/wake-*-windows-*.zip | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } elseif ((Get-Item release-notes.md).Length -gt 0) {
            gh release create $tag $zip --title $tag --notes-file release-notes.md --target $env:GITHUB_SHA
          } else {
            gh release create $tag $zip --title $tag --generate-notes --target $env:GITHUB_SHA
          }
