name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # gpui Linux 后端的系统依赖(Wayland/X11/字体/音频头文件)
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libzstd-dev \
            pkg-config cmake clang

      # 数据层测试:adapter 解析契约 / seq 一致性 / db 往返 / 扫描终态
      - name: Test wake-core
        run: cargo test -p wake-core

      # UI crate 内不启动窗口的纯逻辑单测；联网测试标为 ignored
      - name: Test app logic
        run: cargo test -p wake

      # GPUI 窗口层仍以三平台编译通过为门槛
      - name: Build app
        run: cargo build -p wake
