[package]
name = "wake-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
dirs.workspace = true
walkdir.workspace = true
notify.workspace = true
chrono.workspace = true
zstd.workspace = true

# Linux/Windows 废纸篓:freedesktop Trash spec / IFileOperation 回收站的
# 纯库实现(macOS 走 Finder/osascript,行为已验证不动)
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
trash = "5"

# Win32 原语:MessageBox 致命弹窗、CF_UNICODETEXT 剪贴板(clip.exe 按控制台
# codepage 解码 stdin,非 ASCII 命令必乱,不走子进程管道)、进程创建旗标
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "scan"
path = "src/bin/scan.rs"
